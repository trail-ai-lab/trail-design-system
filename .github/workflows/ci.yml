name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint (TypeScript + ESLint, incl. token rules)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Build package
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook --quiet

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Story tests (render, interactions, accessibility)
        run: pnpm test:stories

  release-check:
    name: Tag matches package.json version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag and version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
